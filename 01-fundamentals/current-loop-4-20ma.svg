<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="500" fill="#f8fafc"/>
  <text x="500" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">2-Wire 4–20 mA Loop-Powered Transmitter</text>

  <!-- PLC power supply -->
  <rect x="60" y="150" width="150" height="90" rx="8" fill="#a78bfa" stroke="#4c1d95" stroke-width="3"/>
  <text x="135" y="190" text-anchor="middle" font-size="13" font-weight="bold">24 VDC</text>
  <text x="135" y="210" text-anchor="middle" font-size="13" font-weight="bold">Power Supply</text>

  <!-- Transmitter -->
  <rect x="420" y="150" width="180" height="90" rx="8" fill="#fb923c" stroke="#7c2d12" stroke-width="3"/>
  <text x="510" y="190" text-anchor="middle" font-size="13" font-weight="bold">Field</text>
  <text x="510" y="210" text-anchor="middle" font-size="13" font-weight="bold">Transmitter</text>

  <!-- PLC analog input -->
  <rect x="790" y="150" width="150" height="90" rx="8" fill="#22d3ee" stroke="#0e7490" stroke-width="3"/>
  <text x="865" y="190" text-anchor="middle" font-size="13" font-weight="bold">PLC</text>
  <text x="865" y="210" text-anchor="middle" font-size="13" font-weight="bold">Analog Input</text>

  <!-- wires -->
  <line x1="210" y1="175" x2="420" y2="175" stroke="#dc2626" stroke-width="4"/>
  <line x1="600" y1="175" x2="790" y2="175" stroke="#dc2626" stroke-width="4"/>
  <line x1="210" y1="215" x2="600" y2="215" stroke="#1d4ed8" stroke-width="4"/>
  <line x1="600" y1="215" x2="790" y2="215" stroke="#1d4ed8" stroke-width="4"/>

  <!-- shunt resistor at PLC input -->
  <rect x="740" y="165" width="30" height="60" fill="#facc15" stroke="#854d0e" stroke-width="2"/>
  <text x="755" y="250" text-anchor="middle" font-size="11">250 Ω shunt</text>

  <text x="315" y="160" text-anchor="middle" font-size="12" fill="#dc2626">+ loop</text>
  <text x="400" y="235" text-anchor="middle" font-size="12" fill="#1d4ed8">− loop (signal return)</text>

  <text x="500" y="290" text-anchor="middle" font-size="14" fill="#334155">Same two wires carry both power (to the transmitter) and the 4–20 mA signal (back to the PLC)</text>

  <!-- current scale -->
  <g transform="translate(150,340)">
    <line x1="0" y1="0" x2="700" y2="0" stroke="#334155" stroke-width="3"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#334155" stroke-width="3"/>
    <line x1="350" y1="-10" x2="350" y2="10" stroke="#334155" stroke-width="3"/>
    <line x1="700" y1="-10" x2="700" y2="10" stroke="#334155" stroke-width="3"/>
    <text x="0" y="35" text-anchor="middle" font-size="13" font-weight="bold">4 mA (0%)</text>
    <text x="350" y="35" text-anchor="middle" font-size="13" font-weight="bold">12 mA (50%)</text>
    <text x="700" y="35" text-anchor="middle" font-size="13" font-weight="bold">20 mA (100%)</text>
    <text x="0" y="-20" text-anchor="middle" font-size="11" fill="#dc2626">"live zero" —</text>
    <text x="0" y="-5" text-anchor="middle" font-size="11" fill="#dc2626">below this = fault</text>
  </g>

  <text x="500" y="460" text-anchor="middle" fill="#475569" font-size="15" font-style="italic">
    Figure 11 — The 4 mA live zero enables broken-wire detection that a 0 mA baseline never could.
  </text>
</svg>
