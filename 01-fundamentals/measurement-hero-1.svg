<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1400" height="420" fill="#0f172a"/>
  <text x="700" y="45" text-anchor="middle" fill="#e2e8f0" font-size="26" font-weight="bold">Physical Process → Trusted Information</text>

  <!-- Boxes -->
  <g font-size="16" fill="#0f172a">
    <!-- Process -->
    <rect x="30" y="140" width="150" height="90" rx="10" fill="#38bdf8"/>
    <text x="105" y="180" text-anchor="middle" font-weight="bold">Physical</text>
    <text x="105" y="200" text-anchor="middle" font-weight="bold">Process</text>

    <rect x="220" y="140" width="150" height="90" rx="10" fill="#4ade80"/>
    <text x="295" y="180" text-anchor="middle" font-weight="bold">Sensor</text>

    <rect x="410" y="140" width="170" height="90" rx="10" fill="#facc15"/>
    <text x="495" y="175" text-anchor="middle" font-weight="bold">Signal</text>
    <text x="495" y="195" text-anchor="middle" font-weight="bold">Conditioning</text>

    <rect x="620" y="140" width="170" height="90" rx="10" fill="#fb923c"/>
    <text x="705" y="180" text-anchor="middle" font-weight="bold">Transmitter</text>

    <rect x="830" y="140" width="150" height="90" rx="10" fill="#f472b6"/>
    <text x="905" y="175" text-anchor="middle" font-weight="bold">PLC I/O</text>
    <text x="905" y="195" text-anchor="middle" font-weight="bold">/ DAQ</text>

    <rect x="1020" y="140" width="150" height="90" rx="10" fill="#a78bfa"/>
    <text x="1095" y="180" text-anchor="middle" font-weight="bold">PLC</text>

    <rect x="1210" y="140" width="160" height="90" rx="10" fill="#22d3ee"/>
    <text x="1290" y="175" text-anchor="middle" font-weight="bold">HMI /</text>
    <text x="1290" y="195" text-anchor="middle" font-weight="bold">SCADA</text>
  </g>

  <!-- Arrows -->
  <g stroke="#e2e8f0" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <line x1="180" y1="185" x2="215" y2="185"/>
    <line x1="370" y1="185" x2="405" y2="185"/>
    <line x1="580" y1="185" x2="615" y2="185"/>
    <line x1="790" y1="185" x2="825" y2="185"/>
    <line x1="980" y1="185" x2="1015" y2="185"/>
    <line x1="1170" y1="185" x2="1205" y2="185"/>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e2e8f0"/>
    </marker>
  </defs>

  <text x="700" y="300" text-anchor="middle" fill="#94a3b8" font-size="18">
    Every link in this chain can introduce error — trustworthy information requires all of them working together.
  </text>
  <text x="700" y="340" text-anchor="middle" fill="#64748b" font-size="15" font-style="italic">
    Figure 1 — The complete measurement chain from physical reality to operator decision.
  </text>
</svg>
