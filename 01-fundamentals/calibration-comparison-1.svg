<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="500" fill="#fefce8"/>
  <text x="500" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#422006">Calibration: Comparing Against a Traceable Reference</text>

  <!-- Reference standard -->
  <rect x="80" y="130" width="220" height="140" rx="10" fill="#bbf7d0" stroke="#166534" stroke-width="3"/>
  <text x="190" y="190" text-anchor="middle" font-size="16" font-weight="bold">Reference</text>
  <text x="190" y="212" text-anchor="middle" font-size="16" font-weight="bold">Standard</text>
  <text x="190" y="240" text-anchor="middle" font-size="12">(traceable to SI)</text>

  <!-- DUT -->
  <rect x="700" y="130" width="220" height="140" rx="10" fill="#fed7aa" stroke="#9a3412" stroke-width="3"/>
  <text x="810" y="190" text-anchor="middle" font-size="16" font-weight="bold">Device Under</text>
  <text x="810" y="212" text-anchor="middle" font-size="16" font-weight="bold">Test (DUT)</text>
  <text x="810" y="240" text-anchor="middle" font-size="12">(field instrument)</text>

  <!-- comparison node -->
  <circle cx="500" cy="200" r="70" fill="#fef9c3" stroke="#854d0e" stroke-width="3"/>
  <text x="500" y="195" text-anchor="middle" font-size="15" font-weight="bold">Compare</text>
  <text x="500" y="215" text-anchor="middle" font-size="15" font-weight="bold">readings</text>

  <line x1="300" y1="200" x2="430" y2="200" stroke="#422006" stroke-width="3" marker-end="url(#a3)"/>
  <line x1="570" y1="200" x2="700" y2="200" stroke="#422006" stroke-width="3" marker-end="url(#a3)"/>
  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#422006"/>
    </marker>
  </defs>

  <line x1="500" y1="270" x2="500" y2="360" stroke="#422006" stroke-width="3" marker-end="url(#a3)"/>
  <rect x="330" y="360" width="340" height="90" rx="10" fill="#fecaca" stroke="#7f1d1d" stroke-width="3"/>
  <text x="500" y="395" text-anchor="middle" font-size="15" font-weight="bold">Determine Error</text>
  <text x="500" y="418" text-anchor="middle" font-size="13">→ Document calibration certificate</text>

  <text x="500" y="480" text-anchor="middle" fill="#57534e" font-size="15" font-style="italic">
    Figure 6 — Calibration compares a DUT against a traceable reference; the result is documented, with or without adjustment.
  </text>
</svg>
