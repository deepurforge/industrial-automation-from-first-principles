<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="600" fill="#f0f9ff"/>
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#0c4a6e">Non-Contact Radar Level Measurement</text>

  <!-- Tank -->
  <rect x="220" y="120" width="360" height="380" rx="8" fill="none" stroke="#0c4a6e" stroke-width="4"/>
  <rect x="224" y="330" width="352" height="166" fill="#7dd3fc" opacity="0.7"/>
  <text x="400" y="320" text-anchor="middle" font-size="13" fill="#0c4a6e">Vapor space</text>

  <!-- Radar transmitter -->
  <rect x="360" y="80" width="80" height="50" rx="8" fill="#f97316" stroke="#7c2d12" stroke-width="2"/>
  <text x="400" y="72" text-anchor="middle" font-size="13" font-weight="bold">Radar Transmitter</text>
  <polygon points="380,130 420,130 400,150" fill="#f97316"/>

  <!-- pulse -->
  <line x1="400" y1="150" x2="400" y2="325" stroke="#dc2626" stroke-width="3" stroke-dasharray="8,6"/>
  <text x="430" y="240" font-size="13" fill="#dc2626" font-weight="bold">d = c · t / 2</text>
  <line x1="400" y1="325" x2="400" y2="150" stroke="#16a34a" stroke-width="3" stroke-dasharray="8,6" transform="translate(20,0)"/>

  <text x="620" y="235" font-size="13" fill="#16a34a" font-weight="bold">reflection</text>
  <text x="620" y="255" font-size="13" fill="#dc2626" font-weight="bold">pulse sent</text>

  <!-- liquid surface -->
  <path d="M224,330 Q300,320 400,330 T576,330" stroke="#0284c7" stroke-width="3" fill="none"/>
  <text x="400" y="415" text-anchor="middle" font-size="15" font-weight="bold" fill="#0c4a6e">Liquid</text>

  <!-- level indicator -->
  <line x1="600" y1="330" x2="600" y2="496" stroke="#334155" stroke-width="2"/>
  <line x1="590" y1="330" x2="610" y2="330" stroke="#334155" stroke-width="2"/>
  <line x1="590" y1="496" x2="610" y2="496" stroke="#334155" stroke-width="2"/>
  <text x="660" y="420" text-anchor="middle" font-size="13">Level = h</text>

  <text x="400" y="560" text-anchor="middle" fill="#475569" font-size="15" font-style="italic">
    Figure 5 — A microwave pulse is timed as it reflects off the liquid surface; round-trip delay converts directly to distance.
  </text>
</svg>
