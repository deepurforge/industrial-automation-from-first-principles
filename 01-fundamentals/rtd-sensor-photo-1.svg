<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="500" fill="#f8fafc"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">RTD (Pt100) Probe — Structure &amp; Behavior</text>

  <!-- Probe body -->
  <rect x="120" y="150" width="260" height="34" rx="6" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
  <text x="250" y="140" text-anchor="middle" font-size="13" font-weight="bold">Protective sheath</text>

  <rect x="380" y="158" width="60" height="18" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>

  <!-- sensing tip -->
  <circle cx="140" cy="167" r="17" fill="#f97316" stroke="#7c2d12" stroke-width="2"/>
  <text x="140" y="120" text-anchor="middle" font-size="12" font-weight="bold">Pt sensing element</text>

  <!-- connection head -->
  <rect x="440" y="120" width="120" height="94" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <text x="500" y="115" text-anchor="middle" font-size="12" font-weight="bold">Connection head</text>
  <line x1="560" y1="140" x2="640" y2="140" stroke="#1d4ed8" stroke-width="3"/>
  <line x1="560" y1="167" x2="640" y2="167" stroke="#dc2626" stroke-width="3"/>
  <line x1="560" y1="194" x2="640" y2="194" stroke="#1d4ed8" stroke-width="3"/>
  <text x="660" y="145" font-size="12">Wire 1</text>
  <text x="660" y="172" font-size="12">Wire 2</text>
  <text x="660" y="199" font-size="12">Wire 3 (3-wire)</text>

  <!-- graph -->
  <g transform="translate(80,260)">
    <line x1="0" y1="180" x2="600" y2="180" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="180" x2="0" y2="0" stroke="#334155" stroke-width="2"/>
    <text x="300" y="215" text-anchor="middle" font-size="14" font-weight="bold">Temperature (°C)</text>
    <text x="-40" y="90" text-anchor="middle" font-size="14" font-weight="bold" transform="rotate(-90,-40,90)">Resistance (Ω)</text>
    <path d="M0,170 L580,20" stroke="#f97316" stroke-width="4" fill="none"/>
    <text x="480" y="40" font-size="13" fill="#7c2d12" font-weight="bold">R(T) = R₀(1 + αT)</text>
    <text x="20" y="200" font-size="12">100 Ω @ 0°C</text>
  </g>

  <text x="450" y="490" text-anchor="middle" fill="#475569" font-size="15" font-style="italic">
    Figure 4 — An RTD's resistance rises predictably and near-linearly with temperature.
  </text>
</svg>
