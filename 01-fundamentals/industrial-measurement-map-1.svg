<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="700" fill="#f1f5f9"/>
  <text x="600" y="40" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">Instrumented Process Area</text>

  <!-- Tank -->
  <rect x="80" y="150" width="180" height="260" rx="10" fill="#bfdbfe" stroke="#1e40af" stroke-width="3"/>
  <text x="170" y="140" text-anchor="middle" font-size="16" font-weight="bold">Tank</text>
  <circle cx="170" cy="170" r="10" fill="#dc2626"/>
  <text x="190" y="175" font-size="13">Level (radar)</text>
  <circle cx="170" cy="380" r="10" fill="#dc2626"/>
  <text x="190" y="385" font-size="13">Temperature (RTD)</text>

  <!-- Pipe -->
  <rect x="260" y="230" width="220" height="24" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
  <text x="370" y="215" text-anchor="middle" font-size="13" font-weight="bold">Pipe</text>
  <circle cx="370" cy="242" r="9" fill="#dc2626"/>
  <text x="390" y="247" font-size="13">Flow (Coriolis)</text>

  <!-- Valve -->
  <polygon points="480,220 520,242 480,264 480,220" fill="#fbbf24" stroke="#92400e" stroke-width="2"/>
  <polygon points="560,220 520,242 560,264 560,220" fill="#fbbf24" stroke="#92400e" stroke-width="2"/>
  <text x="520" y="200" text-anchor="middle" font-size="13" font-weight="bold">Valve</text>
  <circle cx="520" cy="242" r="9" fill="#dc2626"/>
  <text x="540" y="290" font-size="13">Position feedback</text>

  <!-- Pipe continues -->
  <rect x="560" y="230" width="140" height="24" fill="#94a3b8" stroke="#334155" stroke-width="2"/>

  <!-- Motor -->
  <rect x="700" y="180" width="120" height="120" rx="12" fill="#86efac" stroke="#166534" stroke-width="3"/>
  <circle cx="760" cy="240" r="35" fill="#4ade80" stroke="#166534" stroke-width="2"/>
  <text x="760" y="160" text-anchor="middle" font-size="13" font-weight="bold">Motor</text>
  <circle cx="820" cy="240" r="9" fill="#dc2626"/>
  <text x="836" y="230" font-size="13">Speed</text>
  <text x="836" y="248" font-size="13">Vibration</text>

  <!-- Conveyor -->
  <rect x="80" y="470" width="500" height="30" rx="15" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <circle cx="110" cy="485" r="16" fill="#475569"/>
  <circle cx="550" cy="485" r="16" fill="#475569"/>
  <text x="330" y="455" text-anchor="middle" font-size="13" font-weight="bold">Conveyor</text>
  <circle cx="330" cy="470" r="9" fill="#dc2626"/>
  <text x="350" y="450" font-size="13">Proximity / speed</text>

  <!-- Electrical panel -->
  <rect x="900" y="420" width="180" height="220" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
  <text x="990" y="405" text-anchor="middle" font-size="13" font-weight="bold">Electrical Panel</text>
  <rect x="920" y="440" width="140" height="20" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="920" y="470" width="140" height="20" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="920" y="500" width="140" height="20" fill="#f8fafc" stroke="#94a3b8"/>
  <circle cx="1080" cy="450" r="9" fill="#dc2626"/>
  <text x="1000" y="560" font-size="13">V / A / kW metering</text>

  <text x="600" y="670" text-anchor="middle" fill="#475569" font-size="15" font-style="italic">
    Figure 2 — A typical process area rarely relies on a single measurement type.
  </text>
</svg>
