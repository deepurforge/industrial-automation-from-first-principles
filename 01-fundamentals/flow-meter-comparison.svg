<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1100" height="600" fill="#f8fafc"/>
  <text x="550" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">Flow Measurement — Five Technologies, Five Principles</text>

  <!-- Orifice -->
  <g transform="translate(30,80)">
    <rect x="0" y="40" width="200" height="30" fill="#94a3b8"/>
    <polygon points="90,40 110,40 105,55 95,55" fill="#dc2626"/>
    <text x="100" y="20" text-anchor="middle" font-size="13" font-weight="bold">Orifice (DP)</text>
    <text x="100" y="95" text-anchor="middle" font-size="12">Q ∝ √ΔP</text>
  </g>

  <!-- Electromagnetic -->
  <g transform="translate(260,80)">
    <rect x="0" y="40" width="200" height="30" fill="#94a3b8"/>
    <circle cx="100" cy="55" r="35" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="4,4"/>
    <text x="100" y="20" text-anchor="middle" font-size="13" font-weight="bold">Electromagnetic</text>
    <text x="100" y="110" text-anchor="middle" font-size="12">V ∝ velocity (B field)</text>
  </g>

  <!-- Vortex -->
  <g transform="translate(490,80)">
    <rect x="0" y="40" width="200" height="30" fill="#94a3b8"/>
    <rect x="95" y="35" width="10" height="40" fill="#dc2626"/>
    <path d="M105,40 Q130,45 105,55 Q130,60 105,70" stroke="#0ea5e9" stroke-width="2" fill="none"/>
    <text x="100" y="20" text-anchor="middle" font-size="13" font-weight="bold">Vortex Shedding</text>
    <text x="100" y="110" text-anchor="middle" font-size="12">freq ∝ velocity</text>
  </g>

  <!-- Coriolis -->
  <g transform="translate(720,80)">
    <path d="M0,55 Q50,20 100,55 Q150,90 200,55" stroke="#94a3b8" stroke-width="14" fill="none"/>
    <text x="100" y="20" text-anchor="middle" font-size="13" font-weight="bold">Coriolis</text>
    <text x="100" y="115" text-anchor="middle" font-size="12">phase shift ∝ mass flow</text>
  </g>

  <!-- Ultrasonic -->
  <g transform="translate(950,80)">
    <rect x="0" y="40" width="120" height="30" fill="#94a3b8"/>
    <line x1="10" y1="30" x2="110" y2="70" stroke="#f97316" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="60" y="20" text-anchor="middle" font-size="13" font-weight="bold">Ultrasonic</text>
    <text x="60" y="110" text-anchor="middle" font-size="12">Δt (with/against)</text>
  </g>

  <!-- table -->
  <g font-size="14">
    <text x="60" y="280" font-weight="bold" fill="#0f172a">Technology</text>
    <text x="330" y="280" font-weight="bold" fill="#0f172a">Best Suited For</text>
    <text x="700" y="280" font-weight="bold" fill="#0f172a">Limitation</text>
    <line x1="30" y1="295" x2="1070" y2="295" stroke="#cbd5e1"/>

    <text x="60" y="325">Orifice / DP</text>
    <text x="330" y="325">Low-cost, general service</text>
    <text x="700" y="325">Square-root response, poor turndown</text>

    <text x="60" y="360">Electromagnetic</text>
    <text x="330" y="360">Conductive liquids, slurries</text>
    <text x="700" y="360">Fails on gases / hydrocarbons</text>

    <text x="60" y="395">Vortex</text>
    <text x="330" y="395">Steam, gas, clean liquids</text>
    <text x="700" y="395">Minimum velocity required</text>

    <text x="60" y="430">Coriolis</text>
    <text x="330" y="430">High-accuracy mass flow &amp; density</text>
    <text x="700" y="430">Higher cost, pressure drop</text>

    <text x="60" y="465">Ultrasonic</text>
    <text x="330" y="465">Non-invasive (clamp-on), large pipes</text>
    <text x="700" y="465">Sensitive to profile / bubbles</text>
  </g>

  <text x="550" y="550" text-anchor="middle" fill="#475569" font-size="15" font-style="italic">
    Figure 9 — Different physical principles behave differently with viscosity, conductivity, and particulates.
  </text>
</svg>
