<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1100" height="560" fill="#fafaf9"/>
  <text x="550" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1c1917">Every Sensor Is an Energy-Domain Translator</text>

  <g font-size="15" font-weight="bold" fill="#1c1917">
    <rect x="40" y="90" width="200" height="60" rx="10" fill="#fecaca"/>
    <text x="140" y="125" text-anchor="middle">Mechanical</text>

    <rect x="40" y="170" width="200" height="60" rx="10" fill="#fed7aa"/>
    <text x="140" y="205" text-anchor="middle">Thermal</text>

    <rect x="40" y="250" width="200" height="60" rx="10" fill="#fef08a"/>
    <text x="140" y="285" text-anchor="middle">Magnetic</text>

    <rect x="40" y="330" width="200" height="60" rx="10" fill="#bbf7d0"/>
    <text x="140" y="365" text-anchor="middle">Optical</text>

    <rect x="40" y="410" width="200" height="60" rx="10" fill="#bfdbfe"/>
    <text x="140" y="445" text-anchor="middle">Chemical</text>
  </g>

  <!-- Converging lines -->
  <g stroke="#78716c" stroke-width="3" fill="none">
    <line x1="240" y1="120" x2="480" y2="280"/>
    <line x1="240" y1="200" x2="480" y2="280"/>
    <line x1="240" y1="280" x2="480" y2="280"/>
    <line x1="240" y1="360" x2="480" y2="280"/>
    <line x1="240" y1="440" x2="480" y2="280"/>
  </g>

  <circle cx="520" cy="280" r="60" fill="#f8fafc" stroke="#1c1917" stroke-width="3"/>
  <text x="520" y="275" text-anchor="middle" font-size="15" font-weight="bold">Sensing</text>
  <text x="520" y="295" text-anchor="middle" font-size="15" font-weight="bold">Element</text>

  <line x1="580" y1="280" x2="760" y2="280" stroke="#1c1917" stroke-width="4" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1c1917"/>
    </marker>
  </defs>

  <rect x="780" y="230" width="260" height="100" rx="10" fill="#0f172a"/>
  <text x="910" y="270" text-anchor="middle" font-size="17" font-weight="bold" fill="#e2e8f0">Electrical</text>
  <text x="910" y="295" text-anchor="middle" font-size="17" font-weight="bold" fill="#e2e8f0">Signal</text>
  <text x="910" y="315" text-anchor="middle" font-size="12" fill="#94a3b8">(R, V, I, C, f)</text>

  <text x="550" y="520" text-anchor="middle" fill="#57534e" font-size="15" font-style="italic">
    Figure 3 — Mechanical, thermal, magnetic, optical, and chemical phenomena all converge into one common language: electricity.
  </text>
</svg>
